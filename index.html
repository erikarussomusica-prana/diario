<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diário Prana</title>
<meta name="theme-color" content="#3a0b52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diário Prana">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" id="mf" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#3a0b52}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F6F2FA}
  .msg{color:#fff;font:16px system-ui,sans-serif;text-align:center;padding:40vh 24px 0}
  .voltar{position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:5;background:#3a0b52;color:#fff;
    font:600 14px system-ui,sans-serif;padding:10px 14px;border-radius:99px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.3)}
</style>
</head>
<body>
<script>
  /* Aluno: .../?a=CHAVE  ·  Professora: .../?p=erika&k=CHAVE (lista de todos os alunos).
     A chave fica guardada neste celular, para o ícone da tela inicial abrir direto.
     No celular da professora, o ícone abre a lista de alunos. */
  var APP = 'https://script.google.com/macros/s/AKfycbzAgZG3jnwJiKeUMTWSFhbieKL3iDy3nTIqASMZR1waSW8flh3aUXdMTSlh_joA848ToA/exec';
  var q = new URLSearchParams(location.search), a = q.get('a'), p = q.get('p'), k = q.get('k'), src = '';
  var ok = function (v) { return v && /^[\w-]{3,40}$/.test(v); };
  try {
    if (ok(p) && ok(k)) localStorage.setItem('diario_p', p + '|' + k);
    else if (a) localStorage.setItem('diario_a', a);
    else {
      var sp = localStorage.getItem('diario_p');
      if (sp) { p = sp.split('|')[0]; k = sp.split('|')[1]; } else a = localStorage.getItem('diario_a');
    }
  } catch (e) {}
  var prof = null; try { prof = localStorage.getItem('diario_p'); } catch (e) {}
  if (ok(p) && ok(k) && !q.get('a')) src = APP + '?p=' + encodeURIComponent(p) + '&k=' + encodeURIComponent(k);
  else if (ok(a)) src = APP + '?a=' + encodeURIComponent(a);
  function titulo(t) {
    if (!t || typeof t !== 'string' || t.length > 60) return;
    document.title = t;
    var m = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if (m) m.content = t;
    try {
      var base = location.href.split('?')[0].replace(/[^\/]*$/, '');
      var man = { name: t, short_name: t.replace('Diário de ', 'Diário '), start_url: location.href, scope: base, display: 'standalone',
        background_color: '#3a0b52', theme_color: '#3a0b52',
        icons: [{ src: base + 'icon-192.png', sizes: '192x192', type: 'image/png' }, { src: base + 'icon-512.png', sizes: '512x512', type: 'image/png' },
                { src: base + 'icon-maskable-512.png', sizes: '512x512', type: 'image/png', purpose: 'maskable' }] };
      document.getElementById('mf').href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/manifest+json' }));
    } catch (e) {}
  }
  var chaveT = 'diario_titulo_' + (ok(p) && ok(k) && !q.get('a') ? 'prof' : a);
  try { titulo(localStorage.getItem(chaveT)); } catch (e) {}
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || !d.diarioTitulo || !/(^|\.)(googleusercontent|google)\.com$/.test(new URL(ev.origin).hostname)) return;
    titulo(d.diarioTitulo);
    try { localStorage.setItem(chaveT, d.diarioTitulo); } catch (e) {}
  });
  if (src) {
    var f = document.createElement('iframe');
    f.src = src;
    f.title = 'Diário Prana';
    f.allow = 'microphone; camera; clipboard-write; autoplay';
    document.body.appendChild(f);
    if (prof && q.get('a')) {
      var v = document.createElement('a');
      v.className = 'voltar'; v.href = './'; v.textContent = '← Alunos';
      document.body.appendChild(v);
    }
  } else {
    document.body.innerHTML = '<div class="msg"><p>Cole aqui o link do seu diário que a Prana mandou no WhatsApp:</p>' +
      '<input id="lk" type="url" placeholder="https://erikarussomusica-prana.github.io/diario/?a=..." style="width:100%;max-width:420px;font:16px system-ui;padding:12px;border-radius:12px;border:0;margin:8px 0">' +
      '<br><button id="ok" style="font:600 16px system-ui;padding:12px 22px;border-radius:12px;border:0;background:#E3C8FA;color:#2A0F3D">Abrir meu diário</button></div>';
    document.getElementById('ok').onclick = function () {
      var v = document.getElementById('lk').value, m = v.match(/[?&]a=([\w-]{3,40})/);
      if (!m) { alert('Esse não parece ser o link do diário. Copie a mensagem da Prana de novo.'); return; }
      try { localStorage.setItem('diario_a', m[1]); } catch (e) {}
      location.href = './?a=' + m[1];
    };
  }
</script>
</body>
</html>
